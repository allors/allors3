<div class="container-fluid" *ngIf="object">
  <div class="row">
    <a-mat-select
      class="col-md"
      [object]="object"
      [roleType]="m.UserProfile.DefaultInternalOrganization"
      [options]="internalOrganizations"
      display="DisplayName"
    ></a-mat-select>
    <a-mat-select
      class="col-md"
      [object]="object"
      [roleType]="m.UserProfile.DefaulLocale"
      [options]="supportedLocales"
      display="Name"
    ></a-mat-select>
  </div>

  <div class="row">
    <a-mat-select
      class="col-md-6"
      [object]="user"
      [roleType]="m.Person.EmailFrequency"
      [options]="emailFrequencies"
      display="Name"
    >
    </a-mat-select>
    <a-mat-file
      class="col-md"
      [object]="user"
      [roleType]="m.Person.Picture"
      accept="image/*"
    ></a-mat-file>
  </div>
</div>
