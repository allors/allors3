name: CI

# Every pull request, and every push to main and the version branches, runs on Linux: one job per
# adapter suite, and the Core and TypeScript suites on the Snapshot adapter, where the domain tests run
# on Memory. A push to main also runs the Core and TypeScript suites on SQL Server and PostgreSQL, the
# domain tests included. The Windows legs run in nightly.yml. Every leg is one call of tests.yml.

# A branch runs through its pull request, whatever the base branch: the pull_request trigger has no
# branch filter, so a pull request stacked on another branch runs too. A push trigger for branches would
# run every leg twice for a branch that has a pull request, once for each event. Before the pull request
# exists, a run can be started on demand.
on:
  push:
    branches:
      - main
      - 'v[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Documentation-only changes skip the suites below. The `result` job at the end always runs and is
  # the one status check that the main ruleset requires: a job skipped by its `if` reports a single
  # check under its unrendered name, so the suites themselves cannot be required, and a path filter
  # on the workflow itself would leave every check pending.
  changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    outputs:
      platform: ${{ steps.paths.outputs.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the changed paths with the documentation paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          platform=true
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
              printf '%s\n' "$changed"
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -v -E '^(AGENTS|ARCHITECTURE|CHANGELOG|README)\.md$' | grep -q .; then
                platform=false
              fi
            else
              echo "Base commit '$BASE_SHA' is not available; running the platform suites."
            fi
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "Run the platform suites: $platform"

  # The adapter suites, one job per adapter. The SQL Server and PostgreSQL suites create their own
  # databases with the admin connection of their service container.
  adapters-memory:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      provider: memory
      targets: '["CiDotnetSystemAdaptersTestMemory"]'

  adapters-snapshot:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      provider: snapshot
      targets: '["CiDotnetSystemAdaptersTestSnapshot"]'

  adapters-sqlclient:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      provider: sqlclient
      targets: '["CiDotnetSystemAdaptersTestSqlClient"]'

  adapters-npgsql:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      provider: npgsql
      targets: '["CiDotnetSystemAdaptersTestNpgsql"]'

  # The Core and TypeScript suites on the Snapshot adapter, the configuration root on config/snapshot:
  # no database server, the build's `Commands init` has nothing to create, the Core test server builds
  # its population through Test/Setup, and the domain tests run on Memory.
  core-snapshot:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      provider: snapshot
      targets: '["CiDotnetCoreDatabaseTest", "CiDotnetCoreWorkspaceLocalTest", "CiDotnetCoreWorkspaceRemoteJsonSystemTextTest", "CiDotnetCoreWorkspaceRemoteJsonNewtonsoftTest", "CiTypescriptWorkspaceTest", "CiTypescriptWorkspaceAdaptersJsonTest"]'

  # On a push to main the same suites run on SQL Server and PostgreSQL as well, the domain tests
  # included: `--provider` points the configuration root at config/sqlclient or config/npgsql, and the
  # build's `Commands init` creates the database and its login with the admin connection.
  core-sqlclient:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      provider: sqlclient
      targets: '["CiDotnetCoreDatabaseTest", "CiDotnetCoreWorkspaceLocalTest", "CiDotnetCoreWorkspaceRemoteJsonSystemTextTest", "CiDotnetCoreWorkspaceRemoteJsonNewtonsoftTest", "CiTypescriptWorkspaceTest", "CiTypescriptWorkspaceAdaptersJsonTest"]'

  core-npgsql:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      provider: npgsql
      targets: '["CiDotnetCoreDatabaseTest", "CiDotnetCoreWorkspaceLocalTest", "CiDotnetCoreWorkspaceRemoteJsonSystemTextTest", "CiDotnetCoreWorkspaceRemoteJsonNewtonsoftTest", "CiTypescriptWorkspaceTest", "CiTypescriptWorkspaceAdaptersJsonTest"]'

  # The one required status check: the legs of this run passed, or all were skipped for a
  # documentation-only change. The SQL Server and PostgreSQL Core legs count on a push to main.
  result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [changes, adapters-memory, adapters-snapshot, adapters-sqlclient, adapters-npgsql, core-snapshot, core-sqlclient, core-npgsql]
    if: ${{ always() }}
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Require the legs of this run to have passed or to have been skipped for a documentation-only change
        env:
          CHANGES: ${{ needs.changes.result }}
          PLATFORM: ${{ needs.changes.outputs.platform }}
          MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          ADAPTERS_MEMORY: ${{ needs.adapters-memory.result }}
          ADAPTERS_SNAPSHOT: ${{ needs.adapters-snapshot.result }}
          ADAPTERS_SQLCLIENT: ${{ needs.adapters-sqlclient.result }}
          ADAPTERS_NPGSQL: ${{ needs.adapters-npgsql.result }}
          CORE_SNAPSHOT: ${{ needs.core-snapshot.result }}
          CORE_SQLCLIENT: ${{ needs.core-sqlclient.result }}
          CORE_NPGSQL: ${{ needs.core-npgsql.result }}
        run: |
          echo "changes=$CHANGES platform=$PLATFORM main=$MAIN"
          echo "adapters: memory=$ADAPTERS_MEMORY snapshot=$ADAPTERS_SNAPSHOT sqlclient=$ADAPTERS_SQLCLIENT npgsql=$ADAPTERS_NPGSQL"
          echo "core: snapshot=$CORE_SNAPSHOT sqlclient=$CORE_SQLCLIENT npgsql=$CORE_NPGSQL"
          if [ "$CHANGES" != "success" ]; then
            echo "The change detection did not succeed; every leg must have passed."
            PLATFORM=true
          fi
          check() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$PLATFORM" != "false" ]; then
                  echo "The leg $1 was skipped although the platform changed."
                  exit 1
                fi
                ;;
              *)
                echo "The leg $1 ended as '$2'."
                exit 1
                ;;
            esac
          }
          check adapters-memory "$ADAPTERS_MEMORY"
          check adapters-snapshot "$ADAPTERS_SNAPSHOT"
          check adapters-sqlclient "$ADAPTERS_SQLCLIENT"
          check adapters-npgsql "$ADAPTERS_NPGSQL"
          check core-snapshot "$CORE_SNAPSHOT"
          if [ "$MAIN" = "true" ]; then
            check core-sqlclient "$CORE_SQLCLIENT"
            check core-npgsql "$CORE_NPGSQL"
          fi
          echo "The legs of this run passed, or were all skipped for a documentation-only change."
