name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]*'
      - 'feature/**'
      - 'issue/**'
  pull_request:
    branches:
      - main
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --max_old_space_size=16384
  CI: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Clean incrementing versions (3.1.0-alpha.N) with no -g<commit> suffix in CI too.
  PublicRelease: 'true'
  # Default culture parity with the old Windows 'Set-Culture nl-BE' (the locale is generated per job).
  LANG: nl_BE.UTF-8
  LC_ALL: nl_BE.UTF-8
  # The e2e Playwright tests default to a headed browser (Test.cs); force headless on the display-less CI.
  HEADLESS: 'true'

jobs:
  # Documentation-only changes skip the platform suites below. The `result` job at the end always
  # runs and is the one status check that the main ruleset requires: a matrix job skipped by its
  # `if` reports a single check under its unrendered name, so the suites themselves cannot be
  # required, and a path filter on the workflow itself would leave every check pending.
  changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The suite jobs generate the nl-BE locale that the workflow env selects; this job does not.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    outputs:
      platform: ${{ steps.paths.outputs.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the changed paths with the documentation paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          platform=true
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
              printf '%s\n' "$changed"
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -v -E '^(docs/|\.github/workflows/documentation\.yml$|(AGENTS|ARCHITECTURE|CHANGELOG|README)\.md$)' | grep -q .; then
                platform=false
              fi
            else
              echo "Base commit '$BASE_SHA' is not available; running the platform suites."
            fi
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "Run the platform suites: $platform"

  # Suites without a database: Allors.Shared, the in-memory adapter and the Diamond tree, no provider.
  memory:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - CiDotnetSystemSharedTest
          - CiDotnetSystemAdaptersTestMemory
          - CiDotnetDiamondTest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0      # nbgv needs full history for git-height versioning
          fetch-tags: true
      - name: Generate nl-BE locale
        run: sudo locale-gen nl_BE.UTF-8 && sudo update-locale
      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore .NET local tools
        run: dotnet tool restore
      - name: Compute version (nbgv)
        run: dotnet nbgv cloud
      - name: Run Nuke target ${{ matrix.target }}
        run: ./build.sh -target ${{ matrix.target }}
      - name: Upload TRX artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.target }}
          path: artifacts/Tests/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: ${{ matrix.target }}
          path: artifacts/Tests/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  # PostgreSQL provider: adapter test + every provider-agnostic suite.
  npgsql:
    name: ${{ matrix.target }} (npgsql)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: allors
          POSTGRES_PASSWORD: allors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allors"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin connection that can create/drop databases; AdminConnectionString() redirects to 'postgres'.
      ALLORS_NPGSQL: 'Server=localhost;Port=5432;User Id=allors;Password=allors'
    strategy:
      fail-fast: false
      matrix:
        target:
          # Postgres in CI currently covers only the Npgsql adapter. The database/server/workspace/e2e
          # suites run on SqlClient (the sqlclient job below); running the full suite on Npgsql is a
          # tracked follow-up (it surfaces pre-existing npgsql-specific issues: result ordering, long
          # index-name truncation, an Equals empty-pull).
          - CiDotnetSystemAdaptersTestNpgsql
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0
          fetch-tags: true
      - name: Generate nl-BE locale
        run: sudo locale-gen nl_BE.UTF-8 && sudo update-locale
      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore .NET local tools
        run: dotnet tool restore
      - name: Compute version (nbgv)
        run: dotnet nbgv cloud
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run Nuke target ${{ matrix.target }}
        run: ./build.sh -target ${{ matrix.target }} --provider npgsql
      - name: Upload TRX artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.target }}-npgsql
          path: artifacts/Tests/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: ${{ matrix.target }} (npgsql)
          path: artifacts/Tests/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  # SQL Server provider: adapter test + every provider-agnostic suite.
  sqlclient:
    name: ${{ matrix.target }} (sqlclient)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    timeout-minutes: 240
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Allors123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Allors123!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      ALLORS_SQLCLIENT: 'Server=localhost,1433;User Id=sa;Password=Allors123!;TrustServerCertificate=true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - CiDotnetSystemAdaptersTestSqlClient
          - CiDotnetCoreDatabaseTest
          - CiDotnetCoreWorkspaceRemoteJsonSystemTextTest
          - CiDotnetCoreWorkspaceRemoteJsonNewtonsoftTest
          - CiDotnetIdentityDatabaseTest
          - CiDotnetEntraDatabaseTest
          - CiTypescriptWorkspaceTest
          - CiTypescriptWorkspaceAdaptersJsonTest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0
          fetch-tags: true
      - name: Generate nl-BE locale
        run: sudo locale-gen nl_BE.UTF-8 && sudo update-locale
      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore .NET local tools
        run: dotnet tool restore
      - name: Compute version (nbgv)
        run: dotnet nbgv cloud
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run Nuke target ${{ matrix.target }}
        run: ./build.sh -target ${{ matrix.target }} --provider sqlclient
      - name: Upload TRX artifacts
        # Diagnostic download only (the report is published from disk by the next step), so upload
        # just on failure and never let a transient artifact-service flake gate the job.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.target }}-sqlclient
          path: artifacts/Tests/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: ${{ matrix.target }} (sqlclient)
          path: artifacts/Tests/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  # The one required status check: the suites passed, or all were skipped for a documentation-only change.
  result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [changes, memory, npgsql, sqlclient]
    if: ${{ always() }}
    timeout-minutes: 5
    env:
      # The suite jobs generate the nl-BE locale that the workflow env selects; this job does not.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Require the platform suites to have passed or to have been skipped for a documentation-only change
        env:
          CHANGES: ${{ needs.changes.result }}
          PLATFORM: ${{ needs.changes.outputs.platform }}
          MEMORY: ${{ needs.memory.result }}
          NPGSQL: ${{ needs.npgsql.result }}
          SQLCLIENT: ${{ needs.sqlclient.result }}
        run: |
          echo "changes=$CHANGES platform=$PLATFORM memory=$MEMORY npgsql=$NPGSQL sqlclient=$SQLCLIENT"
          if [ "$CHANGES" != "success" ]; then
            echo "The change detection did not succeed; every suite must have passed."
            PLATFORM=true
          fi
          for suite in "$MEMORY" "$NPGSQL" "$SQLCLIENT"; do
            case "$suite" in
              success) ;;
              skipped)
                if [ "$PLATFORM" != "false" ]; then
                  echo "A platform suite was skipped although the platform changed."
                  exit 1
                fi
                ;;
              *)
                echo "A platform suite ended as '$suite'."
                exit 1
                ;;
            esac
          done
          echo "The platform suites passed, or were all skipped for a documentation-only change."
